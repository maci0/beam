name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: ruff + black
        run: make lint
      - name: mypy
        run: make types
      - name: shellcheck
        run: make shell

      - name: yamllint
        run: make yaml

      # The manifest version, ray.__version__ and the versions the docs quote
      # are one number; the tag and CHANGELOG.md say which release it is.
      - name: Release contract
        run: make release-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0

      - name: Syntax check
        run: python3 -m py_compile python/ray/*.py python/ray/**/*.py

      - name: Unit + fuzz tests (100% coverage gate)
        run: make test

      - name: Import surface
        run: make import

      - name: Control-plane harnesses (e2e)
        run: make e2e

  vllm-surface:
    # Informational: checks the shim still covers vLLM main. Allowed to fail
    # so a vLLM-side change doesn't block the build; tighten to a gate by
    # pinning a tag.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Clone vLLM
        run: git clone --depth 1 https://github.com/vllm-project/vllm /tmp/vllm
      - name: Scan ray API usage vs the shim
        run: >-
          uv run --with cloudpickle python scripts/scan_vllm_ray.py
          --src /tmp/vllm
