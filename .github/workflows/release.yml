name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          # same uv the build is verified against locally; see Makefile
          version: "0.12.14"

      # Reproducible-builds.org hygiene: the same source must give the same bytes.
      # SOURCE_DATE_EPOCH is the commit time (deterministic per tag); LC_ALL/TZ
      # pin collation and any formatted date; the paths below strip uid/gid, names
      # and access times so nothing host-specific lands in an archive header.
      - name: Set reproducible-build environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          # keep .pyc out of the tree that gets archived below
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/pycache" >> "$GITHUB_ENV"

      # A tag with no dated CHANGELOG section, or a version the manifest and
      # ray.__version__ disagree on, fails here instead of after the artifact is
      # public. --notes writes this tag's section for the release body, so the
      # published notes are the changelog, not a commit list.
      - name: Check the release contract
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" --notes notes.md

      # A tag push publishes from this job, so CI's gate runs here too: a tagged
      # commit that fails the coverage gate or no longer imports must not ship.
      - name: Unit + fuzz tests (100% coverage gate)
        run: make test

      - name: Import surface
        run: make import

      - name: Build wheel + sdist
        run: |
          # clean tree: a stale dist/ or an untracked file would change the
          # archive contents
          git clean -xdf
          cd python && uv build --out-dir dist

      # The artifact filename carries the distribution version, not the tag, so
      # assert the wheel and sdist that will be published are the ones the
      # manifest declares, not a stale pair left by an earlier build.
      - name: Verify the built artifacts
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" --dist python/dist

      - name: SBOM (CycloneDX)
        # Inventory of what actually ships, straight from uv.lock. No extra
        # tooling: uv can emit CycloneDX natively.
        run: uv export --format cyclonedx1.5 --no-header -o python/dist/beam-sbom.cdx.json

      - name: Bundle the bind-mount payload
        # the shim + examples are all a container needs; exclude build output
        # and caches. --sort=name fixes entry order, --owner/--group=0 and
        # --mtime drop host metadata, and --pax-option delete=atime,delete=ctime
        # keeps pax headers from recording it again. --format=posix is what makes
        # --pax-option legal; the extended header holds only content here, so its
        # size is stable too.
        run: >
          tar --sort=name --numeric-owner --owner=0 --group=0 --mtime="@${SOURCE_DATE_EPOCH}"
          --pax-option=delete=atime,delete=ctime --format=posix
          -czf beam-bindmount-${GITHUB_REF_NAME}.tar.gz
          --exclude=*/dist --exclude=__pycache__ python examples

      - name: Record the build environment next to the artifacts
        # a rebuild has to be attempted with the same toolchain, so write down
        # what built these bytes
        run: |
          {
            echo "tag: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "source_date_epoch: ${SOURCE_DATE_EPOCH}"
            echo "runner_image: ${ImageOS}-${ImageVersion}"
            echo "uv: $(uv --version)"
            # the wheel is py3-none-any; this is the interpreter uv drives
            python: $(uv run --no-project python -V 2>/dev/null || echo 'n/a')
          } > build-env.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            python/dist/*.whl
            python/dist/*.tar.gz
            python/dist/*.cdx.json
            beam-bindmount-*.tar.gz
            build-env.txt

      # Post-publish smoke test: install the wheel exactly as a user would and
      # import it. Catches a wheel that built but does not import; the release is
      # already public at this point, so treat a failure here as a yank signal.
      - name: Install and import the published wheel
        run: >-
          uv run --no-project --with ./python/dist/ray-*.whl
          python examples/import_check.py
