# Repo-root dev tooling config (the installable package lives in python/).
# No [project] table here on purpose: this file only configures lint/format/type.

# uv workspace: `uv run` at the root then resolves and installs the shim itself
# (python/) from python/pyproject.toml. Without it uv finds no project at the
# root, keeps the lock empty, defaults it to requires-python ">=3.13", and
# warns "No requires-python value found in the workspace" on every command.
[tool.uv.workspace]
members = ["python"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".e2e-run", ".mn-run", ".edge-run", ".3node-run", ".cpuhead-run", ".rocm-run", "dist"]

[tool.ruff.lint]
# Every group below is one the tree passes today; keep it that way.
# A: builtin shadowing. ERA: commented-out code. FA: `__future__` correctness
# (py3.9 support needs the import). ICN/PIE/DTZ/LOG: import, import-naming,
# flake8-pie and flake8-logging-format correctness. RUF covers RUF100, which
# reports `noqa` directives that no longer suppress anything.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "A", "ERA", "FA", "ICN", "PIE", "DTZ", "LOG", "RUF"]
# UP031/UP032: %-format is fine and avoids churn. SIM105: contextlib.suppress
# not always clearer. B008: not relevant. RUF059: tests destructure a handler
# reply tuple and assert on the part they care about, e.g. `r, body = run(...)`
# when only `body` matters; the unused name is deliberate, not a defect.
ignore = ["B008", "SIM105", "UP031", "UP032", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"python/ray/cloudpickle.py" = ["F401", "F403"]
"python/ray/actor.py" = ["F401"]
"python/ray/types.py" = ["F401"]
"python/ray/__init__.py" = ["F401"]
"python/ray/util/__init__.py" = ["F401"]
"python/ray/_private/state.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py39"]
extend-exclude = '/(\.e2e-run|\.mn-run|\.edge-run|\.3node-run|\.cpuhead-run|\.rocm-run|dist)/'

[tool.mypy]
python_version = "3.10"
files = ["python/ray"]
ignore_missing_imports = true
# the library is fully annotated; keep it that way
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# These strict-mode checks are all clean in the tree, so they are on rather
# than aspirational: the README's `mypy strict` badge should mean something.
# Not yet enabled (each still has open findings, i.e. typing debt):
#   warn_return_any, warn_unreachable, disallow_any_generics,
#   no_implicit_reexport
strict_equality = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_no_return = true
extra_checks = true

[tool.coverage.run]
source = ["ray"]
omit = ["*/tests/*"]

[tool.coverage.report]
# entrypoint guards and pragma'd defensive branches are not exercised in-process
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
